# 推 macos-v<版本> 标签触发，版本号读 apps/macos/Cargo.toml，
# 流程见 docs/notes/release.md。macOS 的签名与公证可选，下面的 Secrets 配齐才签，否则出 ad-hoc 包；
#   QINGJIAN_CERT_P12            Developer ID Application + Installer 两张证书（含私钥）导出的 .p12，base64
#   QINGJIAN_CERT_PASSWORD       .p12 的密码
#   QINGJIAN_SIGN_IDENTITY       "Developer ID Application: 名字 (TEAMID)"
#   QINGJIAN_INSTALLER_IDENTITY  "Developer ID Installer: 名字 (TEAMID)"
#   QINGJIAN_NOTARY_KEY          App Store Connect API 密钥 .p8，base64
#   QINGJIAN_NOTARY_KEY_ID       密钥的 Key ID
#   QINGJIAN_NOTARY_ISSUER       密钥的 Issuer ID
# 发版后让官网重新构建（也可选）：
#   QINGJIAN_WEB_TOKEN           fine-grained PAT，对 qingjian-team/qingjian-web 有 Contents: read and write
#                                （官网由 Cloudflare 按仓库提交自动构建，tools/release/bump-website.sh 往那边推一个小提交）
#
# 门禁：版本号与标签一致且不带 -dev；标签指向的提交必须在 main 上（防止从没合并的分支或手滑的本地提交发版）。
# Secrets 不放 workflow 顶层 env，只注入真正用它的那一步；有没有配由第一步算成输出（secrets 不能直接写在 if 里）。
# actions 钉到 commit（注释是对应标签），Dependabot 每周更新；产品数据与本地整句模型按 tools/release/data.lock 钉住的 data-vN Release 下载、按锁文件里的哈希校验，标签与哈希记进 build-info.json。
name: release

on:
  push:
    tags: ['macos-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: startsWith(github.ref_name, 'macos-v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bundle.sh 用提交数当构建号；门禁要看 main
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: |
          echo "sign=${{ secrets.QINGJIAN_CERT_P12 != '' }}" >> "$GITHUB_OUTPUT"
          echo "notarize=${{ secrets.QINGJIAN_NOTARY_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "website=${{ secrets.QINGJIAN_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check version matches tag and tag is on main
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/macos/Cargo.toml | head -1)"
          TAG="${GITHUB_REF_NAME#macos-v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "apps/macos/Cargo.toml 是 $VERSION，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/model 2>/dev/null || ls -la data/generated data/generated/dicts

      - name: Import signing certificates
        if: steps.secrets.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.QINGJIAN_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.QINGJIAN_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.QINGJIAN_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.QINGJIAN_INSTALLER_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          {
            echo "QINGJIAN_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "QINGJIAN_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY: ${{ secrets.QINGJIAN_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.QINGJIAN_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.QINGJIAN_NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials qingjian --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "QINGJIAN_NOTARY_PROFILE=qingjian" >> "$GITHUB_ENV"

      - name: Build pkg (arm64)
        run: QINGJIAN_TARGET=aarch64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Build pkg (x86_64)
        run: QINGJIAN_TARGET=x86_64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Checksums and build info
        run: |
          cd target/pkg
          shasum -a 256 ./*.pkg | tee SHA256SUMS
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg toolchain "$(rustc --version)" \
            --arg runner "macOS $(sw_vers -productVersion)" --arg data_tag "$DATA_TAG" --arg data_sha256 "$DATA_SHA256" \
            '{version: $version, tag: $tag, commit: $commit, built_at: $built_at, toolchain: $toolchain, runner: $runner, data_tag: $data_tag, data_sha256: $data_sha256}' \
            | tee build-info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.secrets.outputs.sign }}
        run: |
          python3 tools/release/releases_json.py --notes-for "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [[ "$SIGNED" != "true" ]]; then
            printf '\n> 这一版没有 Apple 开发者签名，首次打开系统会拦一下：到「系统设置 → 隐私与安全性」底部点「仍要打开」再装一次。\n' >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" --title "青简 $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            target/pkg/*.pkg target/pkg/SHA256SUMS target/pkg/build-info.json

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" target/pkg

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: tools/release/bump-website.sh
